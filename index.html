<!DOCTYPE html>
<html lang="ko">
<head>
  <meta name="google-site-verification" content="HybS8L-BZ8E479CQ-qVUCVsQ7zmUzLFcGTbnai29vDo" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 연봉 · 월급 실수령액 계산기</title>
  <style>
    body {
      margin: 0;
      padding: 40px 16px;
      background-color: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .calc-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      padding: 28px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid #eef0f3;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      margin: 0 0 20px;
      color: #111;
    }
    .tab-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .tab-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #f8f9fa;
      color: #666;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #0066ff;
      color: #fff;
      border-color: #0066ff;
    }
    .input-box {
      margin-bottom: 20px;
    }
    .input-box label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #666;
      margin-bottom: 6px;
    }
    .input-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      border: 1.5px solid #e1e4e8;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      outline: none;
    }
    .input-box input:focus {
      border-color: #0066ff;
    }
    .result-box {
      background: #f4f7fb;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .result-row-main {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .result-row-main span:first-child {
      font-size: 14px;
      font-weight: 600;
      color: #555;
    }
    .result-row-main span:last-child {
      font-size: 24px;
      font-weight: 800;
      color: #0066ff;
    }
    .result-row-sub {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #888;
    }
    .detail-list {
      border-top: 1px solid #eee;
      padding-top: 14px;
      font-size: 13px;
      color: #555;
    }
    .detail-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .footer-note {
      margin-top: 16px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="calc-card">
  <h1>연봉 · 월급 실수령액 계산기</h1>
  
  <div class="tab-group">
    <button type="button" id="type-annual" class="tab-btn active" onclick="setCalcType('annual')">연봉 기준</button>
    <button type="button" id="type-monthly" class="tab-btn" onclick="setCalcType('monthly')">월급 기준</button>
  </div>

  <div class="input-box">
    <label id="input-label">세전 연봉 (원)</label>
    <input type="text" id="calc-amount" placeholder="예: 40,000,000" oninput="formatAndCalculate(this)" />
  </div>

  <div class="result-box">
    <div class="result-row-main">
      <span>예상 월 실수령액</span>
      <span id="res-net-pay">0 원</span>
    </div>
    <div class="result-row-sub">
      <span>총 공제액(월)</span>
      <span id="res-total-deduct">0 원</span>
    </div>
  </div>

  <div class="detail-list">
    <div class="detail-item">
      <span>국민연금 (4.5%)</span>
      <span id="res-pension">0 원</span>
    </div>
    <div class="detail-item">
      <span>건강보험 (3.545%)</span>
      <span id="res-health">0 원</span>
    </div>
    <div class="detail-item">
      <span>장기요양 (건보의 12.95%)</span>
      <span id="res-care">0 원</span>
    </div>
    <div class="detail-item">
      <span>고용보험 (0.9%)</span>
      <span id="res-employ">0 원</span>
    </div>
    <div class="detail-item">
      <span>소득세 (지방소득세 포함)</span>
      <span id="res-tax">0 원</span>
    </div>
  </div>

  <div class="footer-note">* 2026년 4대보험 요율 및 간이세액 추정치 적용</div>
</div>

<script>
let calcMode = 'annual';

function setCalcType(type) {
  calcMode = type;
  const btnAnnual = document.getElementById('type-annual');
  const btnMonthly = document.getElementById('type-monthly');
  const label = document.getElementById('input-label');
  const input = document.getElementById('calc-amount');

  if (type === 'annual') {
    btnAnnual.classList.add('active');
    btnMonthly.classList.remove('active');
    label.innerText = '세전 연봉 (원)';
    input.placeholder = '예: 40,000,000';
  } else {
    btnMonthly.classList.add('active');
    btnAnnual.classList.remove('active');
    label.innerText = '세전 월급 (원)';
    input.placeholder = '예: 3,000,000';
  }
  formatAndCalculate(input);
}

function formatAndCalculate(elem) {
  let value = elem.value.replace(/[^0-9]/g, '');
  if (!value) {
    elem.value = '';
    resetValues();
    return;
  }
  elem.value = Number(value).toLocaleString();

  let numVal = parseInt(value, 10);
  let monthlyGross = calcMode === 'annual' ? Math.floor(numVal / 12) : numVal;

  let pensionBase = Math.min(Math.max(monthlyGross, 390000), 6170000);
  let pension = Math.floor((pensionBase * 0.045) / 10) * 10;
  let health = Math.floor((monthlyGross * 0.03545) / 10) * 10;
  let care = Math.floor((health * 0.1295) / 10) * 10;
  let employ = Math.floor((monthlyGross * 0.009) / 10) * 10;

  let taxable = Math.max(0, monthlyGross - 200000);
  let incomeTax = 0;
  if (taxable > 8000000) incomeTax = taxable * 0.15;
  else if (taxable > 4000000) incomeTax = taxable * 0.08;
  else if (taxable > 2000000) incomeTax = taxable * 0.03;
  else if (taxable > 1000000) incomeTax = taxable * 0.01;
  else incomeTax = 0;
  
  incomeTax = Math.floor(incomeTax / 10) * 10;
  let localTax = Math.floor((incomeTax * 0.1) / 10) * 10;
  let totalTax = incomeTax + localTax;

  let totalDeduct = pension + health + care + employ + totalTax;
  let netPay = monthlyGross - totalDeduct;

  document.getElementById('res-net-pay').innerText = netPay.toLocaleString() + ' 원';
  document.getElementById('res-total-deduct').innerText = totalDeduct.toLocaleString() + ' 원';
  document.getElementById('res-pension').innerText = pension.toLocaleString() + ' 원';
  document.getElementById('res-health').innerText = health.toLocaleString() + ' 원';
  document.getElementById('res-care').innerText = care.toLocaleString() + ' 원';
  document.getElementById('res-employ').innerText = employ.toLocaleString() + ' 원';
  document.getElementById('res-tax').innerText = totalTax.toLocaleString() + ' 원';
}

function resetValues() {
  const ids = ['res-net-pay', 'res-total-deduct', 'res-pension', 'res-health', 'res-care', 'res-employ', 'res-tax'];
  ids.forEach(id => {
    document.getElementById(id).innerText = '0 원';
  });
}
</script>

</body>
</html>
